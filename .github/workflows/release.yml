name: Release Daily

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone Linux binary
        run: python packaging/build_binary.py
      - name: Smoke-test Linux binary
        run: |
          ./dist/daily --version
          TMPDB="$(mktemp -d)/test.db"
          DAILY_DB_PATH="$TMPDB" ./dist/daily --no-browser --port 18091 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18091/api/health; then
              echo ""
              curl -fsS http://127.0.0.1:18091/ | grep -qi "Daily"
              curl -fsS http://127.0.0.1:18091/api/analysis | grep -q '"engine":"xgboost"'
              kill $PID
              wait $PID 2>/dev/null || true
              trap - EXIT
              exit 0
            fi
            sleep 0.5
          done
          echo "Smoke test failed" >&2
          exit 1
      - name: Package .deb, .rpm, and .tar.gz
        run: |
          mkdir -p release-out
          bash packaging/build_linux_packages.sh "${{ needs.meta.outputs.version }}" dist/daily release-out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-out/*

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone Windows binary
        run: python packaging/build_binary.py
      - name: Smoke-test & zip Windows release
        shell: pwsh
        run: |
          .\dist\daily.exe --version
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          $stage = "release-out\daily-${{ needs.meta.outputs.tag }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\daily.exe, README.md, LICENSE -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "release-out\daily-${{ needs.meta.outputs.tag }}-windows-x86_64.zip"
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: release-out/*.zip

  build-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone macOS binary
        run: python packaging/build_binary.py
      - name: Smoke-test & package macOS binary
        run: |
          ./dist/daily --version
          mkdir -p release-out "stage/daily-${{ needs.meta.outputs.tag }}-macos-arm64"
          cp dist/daily README.md LICENSE "stage/daily-${{ needs.meta.outputs.tag }}-macos-arm64/"
          tar -C stage -czf "release-out/daily-${{ needs.meta.outputs.tag }}-macos-arm64.tar.gz" "daily-${{ needs.meta.outputs.tag }}-macos-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release-out/*.tar.gz

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Sync Capacitor web bundle
        working-directory: mobile
        run: |
          npm ci
          npm run cap:sync
      - name: Build installable Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p release-out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            "release-out/daily-${{ needs.meta.outputs.tag }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-out/*.apk

  build-web-offline:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package self-hostable offline PWA zip
        run: |
          mkdir -p "stage/daily-${{ needs.meta.outputs.tag }}-web-offline/static" release-out
          DST="stage/daily-${{ needs.meta.outputs.tag }}-web-offline"
          cp static/index.html "$DST/index.html"
          cp static/sw.js "$DST/sw.js"
          cp static/manifest.webmanifest "$DST/manifest.webmanifest"
          cp static/icon.svg static/icon-192.png static/icon-512.png static/apple-touch-icon.png "$DST/"
          cp static/app.js static/style.css static/i18n.js static/local-engine.js static/e2ee-sync.js static/qr.js "$DST/static/"
          cp README.md LICENSE "$DST/"
          (cd stage && zip -rq "../release-out/daily-${{ needs.meta.outputs.tag }}-web-offline.zip" "daily-${{ needs.meta.outputs.tag }}-web-offline")
      - uses: actions/upload-artifact@v4
        with:
          name: web-offline
          path: release-out/*.zip

  publish-release:
    needs: [meta, build-linux, build-windows, build-macos, build-android, build-web-offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: dist-all
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          cat > release-notes.md <<EOF
          # Daily ${TAG}

          **Zero Presets. Zero Cloud Accounts. Zero Tracking.**
          Self-contained local-first habit tracker with signed \`+\` / \`−\` live graph routing, Continuous-Time Liquid Relaxation ODE, offline tabular AI insights, and AES-256-GCM end-to-end encrypted multi-device sync.

          ## Downloads (zero prerequisites — everything bundled!)

          | Platform | File | Install / Run |
          |---|---|---|
          | **Ubuntu / Debian / Mint** | \`daily_${VER}_amd64.deb\` | \`sudo apt install ./daily_${VER}_amd64.deb\` then launch **Daily** from your app menu or run \`daily\` |
          | **Fedora / Bazzite / openSUSE** | \`daily-${VER}-1.x86_64.rpm\` | \`sudo dnf install ./daily-${VER}-1.x86_64.rpm\` |
          | **Linux (portable)** | \`daily-${TAG}-linux-x86_64.tar.gz\` | Extract and run \`./daily\` |
          | **Windows (x64)** | \`daily-${TAG}-windows-x86_64.zip\` | Extract and double-click \`daily.exe\` *(unsigned indie binary: click "More info → Run anyway" on first SmartScreen prompt)* |
          | **macOS (Apple Silicon)** | \`daily-${TAG}-macos-arm64.tar.gz\` | Extract and run \`./daily\` *(unsigned binary: right-click → Open or \`xattr -d com.apple.quarantine daily\`)* |
          | **Android** | \`daily-${TAG}-android.apk\` | Install directly on your phone (offline-first Capacitor app with Daily launcher icon) |
          | **iOS & Instant Web PWA** | [daily.aethelburg.network](https://daily.aethelburg.network) | Safari → Share → **Add to Home Screen** (offline PWA, no App Store certificate expiry) |
          | **Self-hosted Static Web** | \`daily-${TAG}-web-offline.zip\` | Unzip onto any static host / NAS / Nextcloud |

          > **Full local TabPFN v2 foundation model:** Desktop binaries ship with the compact CPU-only XGBoost fallback + full Continuous-Time Liquid ODE so downloads stay lean without bundling 3 GB of PyTorch. For full local **TabPFN v2**, clone the repo and run \`pip install -r requirements-ai.txt && ./start.sh\`.

          Verify downloads via \`sha256sum -c SHA256SUMS.txt\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-all/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist-all/* \
              --title "Daily ${TAG}" \
              --notes-file release-notes.md
          fi
